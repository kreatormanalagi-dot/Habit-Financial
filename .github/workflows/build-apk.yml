name: Build Android APK (Habit & Financial)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Dependencies
        run: npm install

      - name: 4. Build Web Application
        run: npm run build

      - name: 5. Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 6. Sync Capacitor Android
        run: npx cap sync android

      - name: 7. Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: 8. Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 9. Rename APK for Easy Sharing
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/Habit-and-Financial.apk

      - name: 10. Upload APK to GitHub Artifacts (Downloadable)
        uses: actions/upload-artifact@v4
        with:
          name: Habit-and-Financial-APK
          path: output-apk/Habit-and-Financial.apk
          retention-days: 30

      - name: 11. Create Release with APK (Direct Link)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Habit & Financial v1.0.${{ github.run_number }}
          body: |
            ### 📱 Habit & Financial - Offline Android APK
            Aplikasi Habit & Financial siap diinstal di HP Android secara offline.
            
            - **Versi**: 1.0.${{ github.run_number }}
            - **Tipe**: Standalone Offline Android App
            - **Cara Install**: Download file `.apk` di bawah, buka di HP Android Anda, dan pilih **Install**.
          files: output-apk/Habit-and-Financial.apk
